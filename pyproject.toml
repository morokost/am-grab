[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applemusic-dl"
version = "0.2.0"
description = "Библиотека Python и CLI для скачивания треков и альбомов из Apple Music без FFmpeg с тегами и обложками высокого разрешения."
readme = "README.md"
authors = [
    { name = "morokost" }
]
license = "MIT"
requires-python = ">=3.8"
keywords = ["apple-music", "downloader", "m4a", "aac", "mp3", "music", "yt-dlp", "id3", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "requests>=2.28.0",
    "yt-dlp>=2024.0.0",
    "mutagen>=1.46.0",
]

[project.scripts]
apple-dl = "applemusic_dl.cli:main"

[project.urls]
"Homepage" = "https://github.com/example/applemusic-dl"
"Bug Tracker" = "https://github.com/example/applemusic-dl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["applemusic_dl*"]
